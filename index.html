<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2340;--panel:#2a3158;--ink:#f6f1e7;--mute:#a9aed0;--hot:#ff7a59;--gold:#ffc857;--ok:#6ee7b7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:24px 18px 60px}
h1{font-size:2.4rem;font-weight:800;margin:.2em 0 .6em}h2{font-weight:800;margin:.2em 0 .8em}
input,select,button{font:inherit;border-radius:12px;border:2px solid var(--panel);padding:12px 14px;width:100%;margin:6px 0;background:#141831;color:var(--ink)}
button{background:var(--gold);color:#1d2340;font-weight:800;border-color:var(--gold);cursor:pointer}
button.ghost{background:none;color:var(--ink);border-color:var(--panel)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.cards{display:grid;gap:12px;margin-top:14px}
.card{display:grid;grid-template-columns:56px 1fr;text-align:left;background:var(--panel);color:var(--ink);border-color:var(--panel);align-items:center;column-gap:12px}
.card span{font-size:2.2rem;grid-row:span 2}.card small{color:var(--mute);font-weight:500}
label{display:block;color:var(--mute);margin-top:10px}
.bar{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:16px}.bar a{color:var(--gold)}
.row{display:flex;gap:10px}.row button{font-size:1.8rem;padding:16px 0}
.score{font-size:1.6rem;font-weight:800;text-align:center;margin:8px 0}
.note{text-align:center;color:var(--mute);min-height:1.5em}.big{font-size:2.4rem;text-align:center;margin:10px 0}
.win{color:var(--ok)}.lose{color:var(--hot)}
</style></head>
<body><div id="app">Loading…</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<!-- one script tag per game: add a new game by adding a file here -->
<script src="game-rps.js"></script>
<script src="game-handcricket.js"></script>
<script src="app.js"></script>
</body></html>
